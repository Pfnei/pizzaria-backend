info:
  name: register
  type: http
  seq: 1
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "",
        "password": "",
        "salutation": "",
        "salutationDetail": "",
        "firstname": "",
        "lastname": "",
        "email": "",
        "phoneNumber": "",
        "address": "",
        "zipcode": "",
        "city": "",
        "country": "",
        "active": false,
        "admin": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "username": "",
            "password": "",
            "salutation": "",
            "salutationDetail": "",
            "firstname": "",
            "lastname": "",
            "email": "",
            "phoneNumber": "",
            "address": "",
            "zipcode": "",
            "city": "",
            "country": "",
            "active": false,
            "admin": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "userId": "",
            "username": "",
            "firstname": "",
            "lastname": "",
            "email": "",
            "phoneNumber": "",
            "address": "",
            "zipcode": "",
            "city": "",
            "country": "",
            "profilePicture": "",
            "active": false,
            "admin": false
          }
