info:
  name: uploadProfileImage
  type: http
  seq: 1
  tags:
    - file-upload-controller

http:
  method: POST
  url: "{{baseUrl}}/files/profilepicture/:userId"
  params:
    - name: userId
      value: ""
      type: path
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/files/profilepicture/:userId"
      method: POST
      params:
        - name: userId
          value: ""
          type: path
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value: []
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: ""
