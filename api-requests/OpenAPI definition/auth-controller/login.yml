info:
  name: login
  type: http
  seq: 2
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "accessToken": "",
            "user": {
              "userId": "",
              "username": "",
              "firstname": "",
              "lastname": "",
              "email": "",
              "phoneNumber": "",
              "address": "",
              "zipcode": "",
              "city": "",
              "country": "",
              "profilePicture": "",
              "active": false,
              "admin": false
            }
          }
